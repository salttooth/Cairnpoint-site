backend:
  name: git-gateway
  branch: main

media_folder: "assets/docs"
public_folder: "/assets/docs"

collections:
  - name: "resources"
    label: "Resources"
    files:
      - name: "resource_list"
        label: "Resource Library"
        file: "data/resources.json"
        format: "json"
        fields:
          - label: "Resources"
            name: "resources"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - {
                  label: "Type",
                  name: "type",
                  widget: "select",
                  options: ["whitepaper", "guide", "video", "link"],
                  default: "guide"
                }
              - { label: "Description", name: "description", widget: "text" }
              - {
                  label: "Uploaded File",
                  name: "file",
                  widget: "file",
                  required: false,
                  media_library: { config: { multiple: false } }
                }
              - {
                  label: "URL or Video Embed Link",
                  name: "url",
                  widget: "string",
                  required: false,
                  hint: "Use this for external resources or video links. Use Uploaded File for PDFs."
                }
              - {
                  label: "Video Embed URL",
                  name: "embed",
                  widget: "string",
                  required: false,
                  hint: "Optional. Use an embeddable URL such as https://www.youtube.com/embed/VIDEO_ID."
                }
